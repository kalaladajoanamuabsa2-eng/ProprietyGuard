{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6">
    <div>
        <h1 class="text-xl font-bold text-white">Definições da Conta</h1>
        <p class="text-xs text-slate-400 mt-1">Configura onde queres receber os alertas automáticos de prazos.</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs text-slate-400 mb-1">E-mail Principal (Login)</label>
            <input type="email" value="{{ usuario.email }}" disabled class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-500 cursor-not-allowed">
        </div>
        <div>
            <label class="block text-xs text-slate-400 mb-1">E-mail Alternativo para Alertas (Opcional)</label>
            <input type="email" name="alert_email" value="{{ usuario.alert_email or '' }}" placeholder="ex: gestao@imobiliaria.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 outline-none">
            <p class="text-[10px] text-slate-500 mt-1">Se preenchido, os avisos de contratos a expirar serão enviados para este endereço.</p>
        </div>

        <div class="flex space-x-3 pt-2">
            <a href="{{ url_for('index') }}" class="w-1/2 text-center bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition text-sm">
                Voltar
            </a>
            <button type="submit" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition text-sm shadow-md">
                Salvar 💾
            </button>
        </div>
    </form>
</div>

<div class="flex justify-center space-x-6 text-xs text-slate-400 mt-8">
    <a href="{{ url_for('terms') }}" class="hover:text-white transition">Termos de Serviço</a>
    <a href="{{ url_for('privacy') }}" class="hover:text-white transition">Política de Privacidade</a>
</div>

{% endblock %}
