{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6">
    <div class="text-center space-y-1">
        <h1 class="text-xl font-bold text-white">Nova Senha</h1>
        <p class="text-xs text-slate-400">Introduz a tua nova senha de acesso</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-xs text-slate-400 mb-1">Nova Senha</label>
            <input type="password" name="senha" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:border-emerald-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition text-sm shadow-md">
            Atualizar Senha
        </button>
    </form>
</div>

<div class="flex justify-center space-x-6 text-xs text-slate-400 mt-8">
    <a href="{{ url_for('terms') }}" class="hover:text-white transition">Termos de Serviço</a>
    <a href="{{ url_for('privacy') }}" class="hover:text-white transition">Política de Privacidade</a>
</div>

{% endblock %}
