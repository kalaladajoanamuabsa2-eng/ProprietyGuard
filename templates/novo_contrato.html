<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Contrato - ProprietyGuard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-md w-full space-y-6 shadow-2xl">
        <div class="text-center space-y-2">
            <div class="text-3xl">📄</div>
            <h1 class="font-bold text-white text-base">Carregar Novo Contrato</h1>
            <p class="text-xs text-slate-400">Insere o ficheiro (PDF, Word, PowerPoint, Imagem ou TXT) para análise automática.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Ficheiro ou Imagem do Contrato</label>
                <input type="file" name="contrato_pdf" accept=".pdf,.docx,.pptx,.txt,.png,.jpg,.jpeg" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-300 focus:outline-none focus:border-emerald-500 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl transition text-xs shadow-lg">
                Processar com IA
            </button>
        </form>

        <div class="text-center">
            <a href="{{ url_for('index') }}" class="text-xs text-slate-400 hover:text-white transition">Voltar ao Dashboard</a>
        </div>
    </div>
</body>
</html>
